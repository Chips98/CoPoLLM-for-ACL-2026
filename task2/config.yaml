# ================================
# CPRL强化学习消融实验配置文件
# Cognitive Psychology Reinforcement Learning
# ================================

# 消融实验配置 - 直接控制各组件的启用/禁用
ablation:
  disable_kl_constraint: false        # 是否禁用KL散度约束 (false=启用, true=禁用)
  disable_ddqn: false                 # 是否禁用Double DQN (false=启用DDQN, true=使用标准DQN)
  disable_safety_reward: false        # 是否禁用安全奖励 (false=启用, true=禁用)
  disable_strategy_match_reward: false # 是否禁用策略匹配奖励 (false=启用, true=禁用)
  disable_symptom_improvement_reward: true  # 是否禁用症状改善奖励 (false=启用, true=禁用)
# API配置 - 嵌入模型和大语言模型设置
api:
  embedding:
    api_base: http://localhost:6862/v1    # 嵌入API服务地址
    api_key: dummy-key                    # API密钥
    max_concurrent: 32                    # 最大并发请求数
    model_name: Qwen3-Embedding-0.6B      # 嵌入模型名称
    timeout: 30                           # 请求超时时间(秒)
  llm:
    api_base: http://localhost:7863/v1    # LLM API服务地址
    api_key: dummy-key                    # API密钥
    max_tokens: 150                       # 最大生成长度
    model_name: Qwen3-30B-A3B            # 大语言模型名称
    temperature: 0.0                      # 生成温度(0.0=确定性输出)
    timeout: 60                           # 请求超时时间(秒)
# 数据配置 - 训练数据文件路径
data:
  input_path: /Users/zl_24/Documents/Codes/CogEmo-Agent/task2/data/Total_S_train_pool.jsonl  # 训练数据文件路径

# DQN网络架构配置
dqn_architecture:
  action_dim: 10        # 动作空间维度(9种CBT策略 + 1种危机干预)
  embedding_dim: 1024   # 输入嵌入向量维度
  hidden_dim_1: 256     # 第一个隐藏层维度
  hidden_dim_2: 128     # 第二个隐藏层维度

# ε-贪婪探索策略配置
epsilon_greedy:
  eps_start: 0.9        # 初始探索率
  eps_end: 0.1          # 最终探索率
  eps_decay_steps: 50000  # 衰减步数 (linear decay over first half of 100k episodes)
# 实验元信息配置
experiment:
  name: cprl_experiment           # 实验名称
  description: CPRL强化学习消融实验  # 实验描述
  version: v1.0                  # 实验版本

# 日志配置
logging:
  console_output: true           # 是否输出到控制台
  log_level: INFO               # 日志级别: DEBUG, INFO, WARNING, ERROR
  save_loss_log: true           # 是否保存损失日志
  save_experiment_data: true    # 是否保存实验数据

# 输出路径配置
output:
  results_dir: results/wo_kl          # 结果输出目录
  checkpoint_dir: checkpoints   # 检查点保存目录
# 训练恢复配置 - 从检查点恢复训练
resume:
  enabled: false                                                                     # 是否启用训练恢复
  resume_episode_count: 100000                                                       # 恢复训练的迭代次数
  checkpoint_model_path: /home/admin/CogEmo/task2/results/dqn_checkpoints_20251119_130151/policy_net_final.pth     # 模型检查点路径
  checkpoint_loss_log_path: /home/admin/CogEmo/task2/results/training_loss_vectorized_20251119_130151.txt           # 损失日志路径
  checkpoint_exp_log_path: /home/admin/CogEmo/task2/results/experiment_data_20251119_130151.csv                    # 实验数据路径
# 奖励系统配置 - 多维度奖励机制
reward_system:
  # 基础奖励设置
  base_reward_neutral: 0.0      # 中性回复基础奖励
  base_reward_silver: 0.5       # 银牌策略基础奖励
  base_reward_gold: 1.0         # 金牌策略基础奖励
  base_reward_mismatch: -1.0    # 策略不匹配惩罚

  # 最终奖励范围
  final_reward_min: -2.0        # 最小最终奖励
  final_reward_max: 4.0         # 最大最终奖励

  # 症状强度相关的奖励调整
  intensity_mild_silver_bonus: 0.6      # 轻度症状使用银牌策略奖励
  intensity_mild_gold_penalty: -0.8     # 轻度症状使用金牌策略惩罚
  intensity_severe_gold_bonus: 1.2      # 重度症状使用金牌策略奖励
  intensity_severe_non_gold_penalty: -0.5 # 重度症状未使用金牌策略惩罚

  # 质量评估奖励
  quality_weight: 0.5          # 质量评估权重
  quality_bonus_max: 0.5       # 最大质量奖励
# 训练超参数配置
training:
  k_episodes: 100000                     # 训练迭代次数
  batch_size: 32                       # 批次大小
  learning_rate: 1e-4                  # 学习率
  gamma: 0.8                           # 折扣因子
  num_parallel_environments: 32        # 并行环境数量
  validate_every_n_batches: 10         # 每隔多少批次进行一次验证

  # KL散度约束参数
  kl_beta: 0.1                         # KL散度约束权重
  kl_temp: 1.0                         # KL散度温度参数

# 模型更新配置
update:
  target_update_interval: 10           # 目标网络更新间隔(批次)
  replay_buffer_capacity: 10000        # 经验回放缓冲区容量
  checkpoint_num: 1000                   # 模型检查点保存间隔(批次)
